name: CI/CD Docker NDVI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push-images:
    name: Build and Push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./my-ndvi-app
          file: ./my-ndvi-app/Dockerfile
          push: true
          tags: |
            claudio19/ndvi-frontend:sha-${{ github.sha }}
            claudio19/ndvi-frontend:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./my-ndvi-backend
          file: ./my-ndvi-backend/Dockerfile
          push: true
          tags: |
            claudio19/ndvi-backend:sha-${{ github.sha }}
            claudio19/ndvi-backend:latest

  deploy-main:
    name: Deploy on server (main only)
    runs-on: ubuntu-latest
    needs: build-and-push-images
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.SERVER_APP_DIR }}"

            git fetch origin main
            git pull --ff-only origin main

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f